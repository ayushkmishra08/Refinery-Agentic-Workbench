[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "refinery-knowledge-layer"
version = "0.1.0"
description = "Source-grounded refinery engineering knowledge extraction system"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "docling>=2.18.0",
    "neo4j>=5.0",
    "pydantic>=2.0",
    "sentence-transformers>=2.2",
    "httpx>=0.25",
    "rich>=13.0",
    "xxhash>=3.0",
    "onnxruntime>=1.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.setuptools.packages.find]
include = ["knowledge_layer*", "workbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
