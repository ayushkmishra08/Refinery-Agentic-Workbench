# Model capability registry.
#
# Every open-weight model the workbench may use declares a *capability profile*: a score from
# 0 to 1 per task kind. The router matches a task to the best installed model that fits the
# hardware; nothing anywhere else names a model. To add a model: pull it into Ollama (or import
# a signed package with `workbench models import`), add one entry here or in
# data/workbench/models/registry.local.yaml, and it is routable at the next start.
#
# Task kinds (see workbench/models/router.py):
#   classification   short structured verdicts (task type, follow-up kind)
#   resolution       naming equipment the rules missed
#   extraction       structuring causes / checks / actions from passages
#   summarization    grounded prose summaries of retrieved passages
#   composition      writing the released answer from an evidence brief
#   reasoning        multi-step engineering reasoning, comparisons, plans
#   calculation      structuring a calculation (the arithmetic itself is always deterministic)
#   code             writing / fixing Python that runs in the sandbox
#   vision           reading images: P&IDs, scans, photos, handwriting
#   planning         refining a plan DAG
#   tool_agent       choosing the next local tool in an agentic loop
#
# size_gb is the resident size; min_vram_mb is where it fits entirely on the GPU. A model
# that does not fit still routes when nothing better is installed, at a penalty (CPU split).

models:
  - name: qwen3:4b
    family: qwen3
    size_gb: 2.5
    context: 4096
    modalities: [text]
    min_vram_mb: 3500
    capabilities:
      classification: 0.80
      resolution: 0.72
      extraction: 0.70
      summarization: 0.75
      composition: 0.82
      reasoning: 0.68
      calculation: 0.55
      code: 0.66
      vision: 0.00
      planning: 0.70
      tool_agent: 0.70
    notes: Default text model on a 4 GB card; fits fully with a 4k KV cache.

  - name: qwen3.5:2b
    family: qwen3.5
    size_gb: 2.7
    context: 4096
    modalities: [text, image]
